name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build (javac + jar)
        run: ./build.sh
      - name: Tests (perft, engine rules, UI — headless)
        run: ./test.sh
      - name: Upload chess.jar
        uses: actions/upload-artifact@v4
        with:
          name: chess.jar
          path: chess.jar

  cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Tests (perft, adjudication, protocol)
        run: npm test
